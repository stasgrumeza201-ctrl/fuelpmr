<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Топливо ПМР</title>
<meta name="description" content="Цены на бензин и дизель в Приднестровье с официального сайта «Шерифа»: обновление каждые 30 минут, история с марта 2026, АЗС, калькулятор поездки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
/* Главная: липкая 3D-сцена в духе версии 5 «Пенки». Плашка с ценой стоит на месте внутри сцены, меняется только её содержимое. */
.story{position:relative}
.stage{position:sticky;top:64px;height:calc(100vh - 64px);height:calc(100svh - 64px);overflow:hidden;perspective:1300px}
#trigs{position:absolute;inset:0;pointer-events:none}
.trig{height:100vh;height:100svh}
.word{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;pointer-events:none}
.word span{position:absolute;left:38%;transform:translate(-50%,30px) scale(.96);font-weight:800;letter-spacing:-.06em;line-height:.8;font-size:clamp(7rem,30vw,26rem);color:var(--soft);opacity:0;transition:opacity .6s var(--ease),transform .8s var(--ease),color .6s;white-space:nowrap}
.word span.on{opacity:1;transform:translate(-50%,0)}
.drops{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
.drops.on{opacity:1}
.drop{position:absolute;width:var(--s);height:calc(var(--s)*1.3);color:var(--accent);transition:color .6s}
.drop svg{display:block;width:100%;height:100%}
.drop.far svg{filter:blur(2px);opacity:.5}
.drop-front{z-index:3;opacity:0;transition:opacity .6s,color .6s} /* передние капли — отдельные элементы: полноэкранный слой поверх 3D Chrome рисует с ошибкой */
.drop-front.on{opacity:1}

/* закрытая 3D-канистра: корпус, ручка на стойках и крышка — коробки из шести граней */
.can-pos{position:absolute;left:38%;top:52%;width:0;height:0;transform-style:preserve-3d;z-index:2}
.can{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.part{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;border-radius:6px;transition:background-color .6s}
.f-front,.f-back{background:var(--can)}
.f-left,.f-right,.f-bottom{background:var(--can-side)}
.f-top{background:var(--can-top)}
/* выдавленный крест, как на настоящих канистрах */
.x{background:
  linear-gradient(32deg,transparent calc(50% - 3px),rgba(255,255,255,.1) calc(50% - 3px),rgba(255,255,255,.1) calc(50% + 3px),transparent calc(50% + 3px)),
  linear-gradient(-32deg,transparent calc(50% - 3px),rgba(0,0,0,.14) calc(50% - 3px),rgba(0,0,0,.14) calc(50% + 3px),transparent calc(50% + 3px)),var(--can)}
.f-left.x,.f-right.x{background-color:var(--can-side)}
.lbl{position:absolute;inset:16% 12% 12%;display:flex;flex-direction:column;justify-content:space-between;color:var(--label);transition:color .6s}
.lbl .code{font-weight:800;letter-spacing:-.06em;line-height:.85}
.lbl .nm{font-weight:600;opacity:.9}
.lbl .brand{display:flex;justify-content:space-between;opacity:.7;font-weight:500}
.shadow{position:absolute;left:-150px;top:0;width:300px;height:60px;background:radial-gradient(closest-side,rgba(0,0,0,.22),transparent);filter:blur(4px);transform:rotateX(90deg)}

/* плашка с ценой — неподвижна внутри сцены */
.info{position:absolute;right:max(24px,5vw);top:50%;transform:translateY(-50%);width:min(390px,40vw);z-index:5;display:grid;gap:14px}
.info .inner{transition:opacity .35s var(--ease),transform .35s var(--ease)}
.info.swap .inner{opacity:0;transform:translateY(8px)}
.info h1{font-size:1.6rem}
.info .label{font-size:.85rem;font-weight:600;opacity:.65;margin-bottom:6px}
.price{font-weight:800;font-size:clamp(3rem,6vw,4.4rem);letter-spacing:-.05em;line-height:.95}
.price small{font-size:1rem;font-weight:500;letter-spacing:0;opacity:.6;margin-left:.3rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.spark{width:100%;height:56px;display:block;margin-top:14px}
.spark-cap{display:flex;justify-content:space-between;font-size:.78rem;opacity:.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rows{list-style:none;padding:0;display:grid;gap:2px;margin-top:10px}
.rows button{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:none;border:0;border-radius:12px;padding:8px 6px;text-align:left;cursor:pointer;transition:background-color .2s}
.rows button:hover{background:var(--soft)}
.rows .code{display:grid;place-items:center;height:30px;border-radius:8px;color:#fff;font-weight:700;font-size:.85rem}
.rows b{font-weight:700;font-size:1.05rem}
.hint{position:absolute;left:38%;bottom:20px;transform:translateX(-50%);font-size:.85rem;opacity:.55;z-index:5;transition:opacity .4s}

/* дальше — ссылки на разделы */
.next{padding-block:72px 0}
.next h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:24px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{display:grid;gap:10px;text-decoration:none;transition:transform .3s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--ink)}
.tile .icon{width:2rem;height:2rem;color:var(--accent)}
.tile h3{font-size:1.4rem}
.tile p{opacity:.7}
.tile .go{display:flex;align-items:center;gap:.4rem;font-weight:600;margin-top:6px}

@media (max-width:820px){
  .stage{top:64px;height:calc(100svh - 64px - 70px)}
  .word span{left:50%;top:22%;font-size:clamp(6rem,34vw,12rem)}
  .can-pos{left:50%;top:33%}
  .info{left:12px;right:12px;top:auto;bottom:12px;transform:none;width:auto}
  .info.box{padding:16px 18px}
  .price{font-size:2.6rem}
  .spark{height:40px;margin-top:8px}
  .rows button{padding:5px 4px}
  .hint{display:none}
  .tiles{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<main>
  <div class="story" id="story">
    <div class="stage" id="stage">
      <div class="word" id="words" aria-hidden="true"></div>
      <div class="can-pos" id="canPos"><div class="can" id="can"></div></div>
      <section class="info box" id="info" aria-live="polite"><div class="inner" id="infoInner"><p class="muted">Загружаем цены…</p></div></section>
      <span class="hint" id="hint">Листайте вниз, чтобы перебрать виды топлива</span>
    </div>
    <div id="trigs"></div>
  </div>

  <section class="next gutter"><div class="wrap">
    <h2>Что ещё есть на сайте</h2>
    <div class="tiles" id="tiles"></div>
  </div></section>
</main>

<script type="module">
import { chrome, watchData, FUEL_META, icon, rub, esc, fmtDate, deltaPill } from './assets/app.js';
chrome();
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const DROPS = [[8,16,34,.25],[60,10,22,.2],[66,70,46,.5],[4,68,58,.55],[50,86,20,.2],[22,40,26,.22],[70,36,18,.2]];
let api = null, current = 'intro', built = false;

// ---------- канистра: коробка из шести граней с центром в начале координат
function box(w, h, d, cls = '', front = '', back = '') {
  const f = (name, fw, fh, tr, inner = '') => `<div class="f f-${name} ${name === 'left' || name === 'right' || name === 'back' ? cls : ''}" style="width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${tr}">${inner}</div>`;
  return f('front', w, h, `translateZ(${d / 2}px)`, front) + f('back', w, h, `rotateY(180deg) translateZ(${d / 2}px)`, back)
    + f('right', d, h, `rotateY(90deg) translateZ(${w / 2}px)`) + f('left', d, h, `rotateY(-90deg) translateZ(${w / 2}px)`)
    + f('top', w, d, `rotateX(90deg) translateZ(${h / 2}px)`) + f('bottom', w, d, `rotateX(-90deg) translateZ(${h / 2}px)`);
}
const part = (x, y, z, html) => `<div class="part" style="transform:translate3d(${x}px,${y}px,${z}px)">${html}</div>`;
function buildCan() {
  const W = Math.round(Math.min(220, innerWidth * (innerWidth < 820 ? .38 : .17))), H = W * 1.32, D = W * .5;
  const hb = W * .44, post = W * .16, th = W * .07, hx = W * .12, top = -H / 2;
  const label = `<div class="lbl" style="font-size:${W * .065}px"><div><div class="code" id="cCode" style="font-size:${W * .34}px">ПМР</div><div class="nm" id="cName">Цены «Шерифа»</div></div><div class="brand"><span>Топливо ПМР</span><span id="cVol">20 л</span></div></div>`;
  $('#can').innerHTML =
    box(W, H, D, 'x', label, '')
    + part(hx, top - post - th / 2, 0, box(hb, th, D * .3))                                   // ручка
    + part(hx - hb / 2 + th / 2, top - post / 2, 0, box(th, post, D * .3))                    // стойки ручки
    + part(hx + hb / 2 - th / 2, top - post / 2, 0, box(th, post, D * .3))
    + part(-W * .3, top - W * .05, D * .1, box(W * .16, W * .1, W * .16))                     // крышка горловины
    + `<div class="shadow" style="transform:translateY(${H / 2 + 4}px) rotateX(90deg)"></div>`;
}

// ---------- сцена
function buildStory() {
  const words = $('#words'), stage = $('#stage');
  words.innerHTML = `<span data-w="intro" class="on">ПМР</span>` + api.fuels.map(f => `<span data-w="${f.id}">${FUEL_META[f.id].code}</span>`).join('');
  ['intro', ...api.fuels.map(f => f.id)].forEach(fl => {
    const layer = document.createElement('div'); layer.className = 'drops'; layer.dataset.l = fl; stage.insertBefore(layer, $('#canPos'));
    DROPS.forEach(([x, y, s, sp]) => {
      const front = sp >= .45, d = document.createElement('div');
      d.className = 'drop' + (sp < .3 ? ' far' : '') + (front ? ' drop-front' : '');
      d.style.cssText = `left:${x}%;top:${y}%;--s:${s}px`; d.dataset.speed = sp; d.dataset.fl = fl;
      d.innerHTML = icon('drop', '');
      (front ? stage : layer).appendChild(d);
    });
  });
  $('#trigs').innerHTML = ['intro', ...api.fuels.map(f => f.id)].map(id => `<div class="trig" data-f="${id}" id="t-${id}"></div>`).join('');
  $('#story').style.height = `calc(${api.fuels.length + 1} * 100svh)`; // триггеры лежат поверх сцены, по экрану на вид топлива
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setFuel(e.target.dataset.f); }), { rootMargin: '-50% 0px -50% 0px' });
  document.querySelectorAll('.trig').forEach(t => io.observe(t));
  buildCan();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { buildCan(); fillCan(current); }, 150); });
  built = true;
}

function sparkline(id) {
  const edge = Date.now() - 90 * 864e5, h = api.history;
  const pts = h.filter(p => new Date(p.t).getTime() >= edge);
  const before = [...h].reverse().find(p => new Date(p.t).getTime() < edge);
  const series = [...(before ? [{ t: new Date(edge).toISOString(), v: before.rub[id] }] : []), ...pts.map(p => ({ t: p.t, v: p.rub[id] })), { t: new Date().toISOString(), v: api.price(id) }];
  const t0 = new Date(series[0].t).getTime(), t1 = Date.now(), vs = series.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs) || 1;
  const X = t => (new Date(t).getTime() - t0) / (t1 - t0 || 1) * 300, Y = v => 50 - (hi === lo ? 25 : (v - lo) / (hi - lo) * 44) - 3;
  let d = ''; series.forEach((p, i) => { d += i ? `H${X(p.t).toFixed(1)}V${Y(p.v).toFixed(1)}` : `M0 ${Y(p.v).toFixed(1)}`; });
  return { svg: `<svg class="spark" viewBox="0 0 300 50" preserveAspectRatio="none" aria-hidden="true"><path d="${d}V50H0Z" fill="${FUEL_META[id].color}" opacity=".12"/><path d="${d}" fill="none" stroke="${FUEL_META[id].color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`, lo, hi };
}

function infoHtml(id) {
  if (id === 'intro') {
    return `<div class="label">Розничные цены «Шерифа» сегодня</div><h1>Цены на топливо в Приднестровье</h1>
      <ul class="rows num">${api.fuels.map(f => `<li><button type="button" data-go="${f.id}"><span class="code" style="background:${FUEL_META[f.id].color}">${FUEL_META[f.id].code}</span><span>${esc(f.name)}</span><b>${rub(api.price(f.id))} ₽</b></button></li>`).join('')}</ul>`;
  }
  const f = api.fuel(id), lc = api.lastChange(id), m = api.changeOver(id, 30), usd = api.usd(id), card = api.latest.cards?.[1]?.rub?.[id], sp = sparkline(id);
  return `<div class="label">${esc(f.name)}</div><div class="price num">${rub(api.price(id))}<small>₽ / л</small></div>
    <div class="meta num">${lc ? deltaPill(lc.d, ' · ' + fmtDate(lc.t)) : ''}${m != null ? deltaPill(m, ' за месяц') : ''}${usd ? `<span class="pill">$${usd.toFixed(2)}</span>` : ''}${card ? `<span class="pill">${icon('card-linear')}от 1000 л: ${rub(card)}</span>` : ''}</div>
    ${sp.svg}<div class="spark-cap num"><span>90 дней</span><span>${rub(sp.lo)} – ${rub(sp.hi)} ₽</span></div>
    <div class="acts"><a class="btn" href="history.html?fuel=${id}">${icon('history-linear')}История</a><a class="btn ghost" href="trip.html?fuel=${id}">${icon('calculator-linear')}Поездка</a></div>`;
}

function fillCan(id) {
  if (!$('#cCode')) return;
  $('#cCode').textContent = id === 'intro' ? 'ПМР' : FUEL_META[id].code;
  $('#cName').textContent = id === 'intro' ? 'Цены «Шерифа»' : api.fuel(id).name;
}

function setFuel(id, force) {
  if (id === current && !force) return; current = id;
  if (id === 'intro') delete document.documentElement.dataset.fuel; else document.documentElement.dataset.fuel = id;
  document.querySelectorAll('.word span').forEach(w => w.classList.toggle('on', w.dataset.w === id));
  document.querySelectorAll('.drops').forEach(l => l.classList.toggle('on', l.dataset.l === id));
  document.querySelectorAll('.drop-front').forEach(d => d.classList.toggle('on', d.dataset.fl === id));
  fillCan(id);
  const info = $('#info');
  info.classList.add('swap');
  setTimeout(() => {
    $('#infoInner').innerHTML = infoHtml(id);
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => $('#t-' + b.dataset.go).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' })));
    info.classList.remove('swap');
  }, reduce ? 0 : 180);
}

// канистра вращается от прокрутки и наклоняется за курсором; капли — параллакс
let mx = 0, my = 0, ticking = false;
function frame() {
  ticking = false; if (!built) return;
  const story = $('#story'), vh = innerHeight, local = scrollY - story.offsetTop, p = Math.min(Math.max(local / (story.offsetHeight - vh), 0), 1);
  $('#can').style.transform = reduce ? 'rotateX(-12deg) rotateY(-28deg)' : `rotateX(${(-12 - my * 10).toFixed(1)}deg) rotateY(${(-28 + p * 720 + mx * 20).toFixed(1)}deg) translateY(${(Math.sin(p * Math.PI * 10) * 8).toFixed(1)}px)`;
  if (!reduce) document.querySelectorAll('.drop').forEach(el => {
    const i = ['intro', ...api.fuels.map(f => f.id)].indexOf(el.dataset.fl), d = local - i * vh;
    el.style.transform = `translateY(${(-d * el.dataset.speed).toFixed(1)}px) rotate(${(d * .03).toFixed(1)}deg)`;
  });
  $('#hint').style.opacity = local > 40 ? 0 : .55;
}
const req = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };
addEventListener('scroll', req, { passive: true }); addEventListener('resize', req);
if (matchMedia('(pointer:fine)').matches) addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; req(); });

function tiles() {
  const h = api.history, st = api.latest.cities.reduce((n, c) => n + c.stations.length, 0), trip = 150 * 7.5 / 100 * api.price('f-95');
  $('#tiles').innerHTML = [
    ['history.html', 'history-linear', 'История цен', `${h.length} изменений с ${fmtDate(h[0].t, { day: 'numeric', month: 'long', year: 'numeric' })}. График, рекорды и все шаги цены.`],
    ['stations.html', 'map-point-linear', 'Города и АЗС', `${st} заправок в ${api.latest.cities.length} городах, адреса и маршрут в Яндекс Картах.`],
    ['trip.html', 'calculator-linear', 'Сколько стоит поездка', `Тирасполь — Кишинёв и обратно на 95-м ≈ ${rub(trip)} ₽. Посчитайте свою.`],
  ].map(([href, ic, t, p]) => `<a class="tile box" href="${href}">${icon(ic)}<h3>${t}</h3><p>${p}</p><span class="go">Открыть ${icon('arrow-right-linear')}</span></a>`).join('');
}

watchData(next => {
  api = next;
  if (!built) buildStory();
  setFuel(current, true); tiles(); frame();
});
</script>
</body>
</html>
