<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Топливо ПМР</title>
<meta name="description" content="Цены на бензин и дизель в Приднестровье с официального сайта «Шерифа»: обновление каждые 30 минут, история с марта 2026, АЗС, калькулятор поездки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
/* Главная: липкая 3D-сцена. Цвет сцены меняется под вид топлива; всё вокруг нейтральное. */
:root{--head:56px;--st:#E6E9EC;--soft:#D3D8DD;--can:#2A3846;--can-side:#1C2732;--can-top:#3A4B5C;--label:#EEF1F4}
:root[data-fuel="f-98"]{--st:#E7E4F1;--soft:#D5CFEA;--can:#3A2B7A;--can-side:#271C57;--can-top:#4C3B94;--label:#EFEBFA}
:root[data-fuel="f-95p"]{--st:#F3E8D8;--soft:#EBD5B4;--can:#B8701A;--can-side:#8A5212;--can-top:#CC8530;--label:#FFF4E2}
:root[data-fuel="f-95"]{--st:#E1EDE4;--soft:#C6E0CD;--can:#1F7A45;--can-side:#145530;--can-top:#2B8F55;--label:#E9F7EC}
:root[data-fuel="f-dte"]{--st:#E0E9F2;--soft:#C7D8EA;--can:#1D5C99;--can-side:#123E69;--can-top:#2A6FB0;--label:#E8F1FA}
:root[data-fuel="f-dt"]{--st:#E6E5E1;--soft:#D3D2CC;--can:#3A3A34;--can-side:#24241F;--can-top:#4A4A43;--label:#EFEEEA}
.story{position:relative}
#trigs{position:absolute;inset:0;pointer-events:none}
.trig{height:100vh;height:100svh}
.stage{position:sticky;top:var(--head);height:calc(100vh - var(--head));height:calc(100svh - var(--head));overflow:hidden;perspective:1300px;background:var(--st);transition:background-color .5s var(--ease);contain:layout paint}
.word{position:absolute;inset:0;pointer-events:none}
.word span{position:absolute;left:36%;top:50%;transform:translate(-50%,-46%);font-weight:600;letter-spacing:-.05em;line-height:.8;font-size:clamp(7rem,28vw,24rem);color:var(--soft);opacity:0;transition:opacity .5s var(--ease),color .5s var(--ease);white-space:nowrap}
.word span.on{opacity:1}

/* закрытая 3D-канистра: корпус, ручка на стойках и крышка — коробки из шести граней */
.can-pos{position:absolute;left:36%;top:52%;width:0;height:0;transform-style:preserve-3d;z-index:2}
.can{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.part{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;border-radius:6px;backface-visibility:hidden;transition:background-color .5s var(--ease)}
.f-front,.f-back{background:var(--can)}
.f-left,.f-right,.f-bottom{background:var(--can-side)}
.f-top{background:var(--can-top)}
/* выдавленный крест, как на настоящих канистрах */
.x{background:
  linear-gradient(32deg,transparent calc(50% - 3px),rgba(255,255,255,.1) calc(50% - 3px),rgba(255,255,255,.1) calc(50% + 3px),transparent calc(50% + 3px)),
  linear-gradient(-32deg,transparent calc(50% - 3px),rgba(0,0,0,.14) calc(50% - 3px),rgba(0,0,0,.14) calc(50% + 3px),transparent calc(50% + 3px)),var(--can)}
.f-left.x,.f-right.x{background-color:var(--can-side)}
.lbl{position:absolute;inset:16% 12% 12%;display:flex;flex-direction:column;justify-content:space-between;color:var(--label)}
.lbl .code{font-weight:600;letter-spacing:-.04em;line-height:.85}
.lbl .nm{font-weight:500;opacity:.9}
.lbl .brand{display:flex;justify-content:space-between;opacity:.7}
.shadow{position:absolute;left:-150px;top:0;width:300px;height:60px;background:radial-gradient(closest-side,rgba(0,0,0,.2),transparent)}

/* карточка с ценой — неподвижна внутри сцены, меняется только содержимое */
.info{position:absolute;right:max(24px,5vw);top:50%;transform:translateY(-50%);width:min(380px,40vw);z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.info .inner{transition:opacity .2s var(--ease)}
.info.swap .inner{opacity:0}
.info h1{font-size:1.5rem;letter-spacing:-.01em}
.info .sub{color:var(--ink-3);font-size:.9rem;margin-top:4px}
.info h2{display:flex;align-items:center;gap:10px;font-size:1.1rem}
.price{font-weight:500;font-size:clamp(3rem,5.5vw,4rem);letter-spacing:-.03em;line-height:1;margin-top:16px}
.price small{font-size:1rem;letter-spacing:0;color:var(--ink-3);margin-left:6px}
.facts{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin-top:20px;font-size:.92rem}
.facts dt{color:var(--ink-2)}.facts dd{text-align:right}
.spark{width:100%;height:44px;display:block;margin-top:20px}
.spark-cap{font-size:.8rem;color:var(--ink-3);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.rows{list-style:none;padding:0;margin-top:16px;border-top:1px solid var(--line)}
.rows button{width:100%;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;min-height:48px;background:none;border:0;border-bottom:1px solid var(--line);padding:0 4px;text-align:left;cursor:pointer;transition:background-color .15s var(--ease)}
.rows button:hover{background:var(--bg)}
.rows b{font-weight:500;font-size:1.1rem}
.hint{position:absolute;left:36%;bottom:20px;transform:translateX(-50%);font-size:.85rem;color:var(--ink-2);z-index:5;transition:opacity .3s}

/* дальше — разделы */
.sections{padding-block:64px 0}
.sections h2{font-size:1.5rem;margin-bottom:16px}
.links{list-style:none;padding:0;border-top:1px solid var(--line)}
.links a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line);text-decoration:none;transition:background-color .15s var(--ease)}
.links a:hover{background:var(--surface)}
.links b{display:block;font-weight:500;font-size:1.3rem}
.links span{color:var(--ink-2)}
.links .icon{color:var(--ink-3)}

@media (max-width:820px){
  .stage{height:calc(100svh - var(--head) - 64px)}
  .word span{left:50%;top:24%;font-size:clamp(6rem,32vw,11rem)}
  .can-pos{left:50%;top:30%}
  .info{left:12px;right:12px;top:auto;bottom:12px;transform:none;width:auto;padding:16px}
  .info h1{font-size:1.25rem}
  .price{font-size:2.5rem;margin-top:8px}
  .facts{margin-top:12px;font-size:.85rem;gap:4px 12px}
  .spark,.spark-cap{display:none}
  .acts{margin-top:12px}
  .acts .btn{height:40px;flex:1;padding:0 12px;white-space:nowrap}
  .rows{margin-top:8px}
  .rows button{min-height:40px}
  .rows b{font-size:1rem}
  .hint{display:none}
  .sections{padding-block:48px 0}
}
</style>
</head>
<body>
<main>
  <div class="story" id="story">
    <div class="stage" id="stage">
      <div class="word" id="words" aria-hidden="true"></div>
      <div class="can-pos" aria-hidden="true"><div class="can" id="can"></div></div>
      <section class="info box" id="info" aria-live="polite"><div class="inner" id="infoInner"><p class="muted">Загружаем цены</p></div></section>
      <span class="hint" id="hint">Листайте вниз, чтобы перебрать виды топлива</span>
    </div>
    <div id="trigs"></div>
  </div>

  <section class="sections gutter"><div class="wrap">
    <h2>Другие разделы</h2>
    <ul class="links" id="links"></ul>
  </div></section>
</main>

<script type="module">
import { chrome, watchData, FUEL_META, icon, rub, esc, fmtDate, fmtDateTime, tag, delta } from './assets/app.js';
chrome();
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
let api = null, current = 'intro', built = false;

// ---------- канистра: коробка из шести граней с центром в начале координат
function box(w, h, d, cls = '', front = '') {
  const f = (name, fw, fh, tr, inner = '') => `<div class="f f-${name} ${name === 'left' || name === 'right' || name === 'back' ? cls : ''}" style="width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${tr}">${inner}</div>`;
  return f('front', w, h, `translateZ(${d / 2}px)`, front) + f('back', w, h, `rotateY(180deg) translateZ(${d / 2}px)`)
    + f('right', d, h, `rotateY(90deg) translateZ(${w / 2}px)`) + f('left', d, h, `rotateY(-90deg) translateZ(${w / 2}px)`)
    + f('top', w, d, `rotateX(90deg) translateZ(${h / 2}px)`) + f('bottom', w, d, `rotateX(-90deg) translateZ(${h / 2}px)`);
}
const part = (x, y, z, html) => `<div class="part" style="transform:translate3d(${x}px,${y}px,${z}px)">${html}</div>`;
function buildCan() {
  const W = Math.round(Math.min(220, innerWidth * (innerWidth < 820 ? .34 : .17))), H = W * 1.32, D = W * .5;
  const hb = W * .44, post = W * .16, th = W * .07, hx = W * .12, top = -H / 2;
  const label = `<div class="lbl" style="font-size:${W * .065}px"><div><div class="code" id="cCode" style="font-size:${W * .34}px">ПМР</div><div class="nm" id="cName">Цены «Шерифа»</div></div><div class="brand"><span>Топливо ПМР</span><span>20 л</span></div></div>`;
  $('#can').innerHTML =
    box(W, H, D, 'x', label)
    + part(hx, top - post - th / 2, 0, box(hb, th, D * .3))                                   // ручка
    + part(hx - hb / 2 + th / 2, top - post / 2, 0, box(th, post, D * .3))                    // стойки ручки
    + part(hx + hb / 2 - th / 2, top - post / 2, 0, box(th, post, D * .3))
    + part(-W * .3, top - W * .05, D * .1, box(W * .16, W * .1, W * .16))                     // крышка горловины
    + `<div class="shadow" style="transform:translateY(${H / 2 + 4}px) rotateX(90deg)"></div>`;
}

// ---------- сцена: по экрану прокрутки на каждый вид топлива
function buildStory() {
  const ids = ['intro', ...api.fuels.map(f => f.id)];
  $('#words').innerHTML = ids.map(id => `<span data-w="${id}"${id === 'intro' ? ' class="on"' : ''}>${id === 'intro' ? 'ПМР' : FUEL_META[id].code}</span>`).join('');
  $('#trigs').innerHTML = ids.map(id => `<div class="trig" data-f="${id}" id="t-${id}"></div>`).join('');
  $('#story').style.height = `calc(${ids.length} * 100svh)`;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setFuel(e.target.dataset.f); }), { rootMargin: '-50% 0px -50% 0px' });
  document.querySelectorAll('.trig').forEach(t => io.observe(t));
  buildCan();
  let rt, w = innerWidth;
  // на телефоне resize срабатывает при прятании адресной строки — перестраиваем только при смене ширины
  addEventListener('resize', () => { if (innerWidth === w) return; w = innerWidth; clearTimeout(rt); rt = setTimeout(() => { buildCan(); fillCan(current); frame(); }, 150); });
  built = true;
}

function sparkline(id) {
  const edge = Date.now() - 90 * 864e5, h = api.history;
  const before = [...h].reverse().find(p => new Date(p.t).getTime() < edge);
  const series = [...(before ? [{ t: edge, v: before.rub[id] }] : []), ...h.filter(p => new Date(p.t).getTime() >= edge).map(p => ({ t: new Date(p.t).getTime(), v: p.rub[id] })), { t: Date.now(), v: api.price(id) }];
  const t0 = series[0].t, t1 = Date.now(), vs = series.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const X = t => (t - t0) / (t1 - t0 || 1) * 300, Y = v => 40 - (hi === lo ? 18 : (v - lo) / (hi - lo) * 36) - 2;
  let d = ''; series.forEach((p, i) => { d += i ? `H${X(p.t).toFixed(1)}V${Y(p.v).toFixed(1)}` : `M0 ${Y(p.v).toFixed(1)}`; });
  return { svg: `<svg class="spark" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${FUEL_META[id].color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`, lo, hi };
}

function infoHtml(id) {
  if (id === 'intro') {
    return `<h1>Цены на топливо в Приднестровье</h1><p class="sub">АЗС «Шериф», ${fmtDateTime(api.latest.changedAt)}, рублей за литр</p>
      <ul class="rows num">${api.fuels.map(f => `<li><button type="button" data-go="${f.id}">${tag(f.id)}<span>${esc(f.name)}</span><b>${rub(api.price(f.id))}</b></button></li>`).join('')}</ul>`;
  }
  const f = api.fuel(id), lc = api.lastChange(id), m = api.changeOver(id, 30), usd = api.usd(id), card = api.latest.cards?.[1]?.rub?.[id], sp = sparkline(id);
  return `<h2>${tag(id)}${esc(f.name)}</h2><div class="price num">${rub(api.price(id))}<small>₽ за литр</small></div>
    <dl class="facts num">${lc ? `<dt>Последнее изменение, ${fmtDate(lc.t)}</dt><dd>${delta(lc.d)}</dd>` : ''}${m != null ? `<dt>За 30 дней</dt><dd>${delta(m)}</dd>` : ''}${usd ? `<dt>В долларах</dt><dd>$${rub(usd)}</dd>` : ''}${card ? `<dt>Топливная карта от 1000 л</dt><dd>${rub(card)} ₽</dd>` : ''}</dl>
    ${sp.svg}<p class="spark-cap num">90 дней: от ${rub(sp.lo)} до ${rub(sp.hi)} ₽</p>
    <div class="acts"><a class="btn" href="history.html?fuel=${id}">История цены</a><a class="btn ghost" href="trip.html?fuel=${id}">Расчёт поездки</a></div>`;
}

function fillCan(id) {
  if (!$('#cCode')) return;
  $('#cCode').textContent = id === 'intro' ? 'ПМР' : FUEL_META[id].code;
  $('#cName').textContent = id === 'intro' ? 'Цены «Шерифа»' : api.fuel(id).name;
}

function setFuel(id, force) {
  if (id === current && !force) return; current = id;
  if (id === 'intro') delete document.documentElement.dataset.fuel; else document.documentElement.dataset.fuel = id;
  document.querySelectorAll('.word span').forEach(w => w.classList.toggle('on', w.dataset.w === id));
  fillCan(id);
  const info = $('#info');
  info.classList.add('swap');
  setTimeout(() => {
    $('#infoInner').innerHTML = infoHtml(id);
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => $('#t-' + b.dataset.go).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' })));
    info.classList.remove('swap');
  }, reduce ? 0 : 150);
}

// канистра поворачивается от прокрутки; за курсором наклоняется только на компьютере. Каждый кадр меняется один transform.
let mx = 0, my = 0, ticking = false, storyTop = 0, storyRange = 1;
const measure = () => { const s = $('#story'); storyTop = s.offsetTop; storyRange = Math.max(s.offsetHeight - innerHeight, 1); };
function frame() {
  ticking = false; if (!built) return;
  const local = scrollY - storyTop, p = Math.min(Math.max(local / storyRange, 0), 1);
  $('#can').style.transform = reduce ? 'rotateX(-12deg) rotateY(-28deg)' : `rotateX(${(-12 - my * 10).toFixed(1)}deg) rotateY(${(-28 + p * 540 + mx * 20).toFixed(1)}deg)`;
  $('#hint').style.opacity = local > 40 ? 0 : 1;
}
const req = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };
addEventListener('scroll', req, { passive: true });
addEventListener('resize', () => { measure(); req(); });
if (matchMedia('(pointer:fine)').matches) addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; req(); });

function links() {
  const h = api.history, st = api.latest.cities.reduce((n, c) => n + c.stations.length, 0);
  $('#links').innerHTML = [
    ['history.html', 'История цен', `${h.length} изменений с ${fmtDate(h[0].t, { day: 'numeric', month: 'long', year: 'numeric' })}: график, минимумы и максимумы`],
    ['stations.html', 'Города и АЗС', `${st} заправок в ${api.latest.cities.length} городах, адреса и маршрут в Яндекс Картах`],
    ['trip.html', 'Сколько стоит поездка', 'Ваша машина и ваш маршрут; в Украину — через открытые пункты пропуска'],
  ].map(([href, t, p]) => `<li><a href="${href}"><span><b>${t}</b><span>${p}</span></span>${icon('arrow-right-linear')}</a></li>`).join('');
}

watchData(next => {
  api = next;
  if (!built) buildStory();
  setFuel(current, true); links(); measure(); frame();
});
</script>
</body>
</html>
