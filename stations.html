<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Города и АЗС — Топливо ПМР</title>
<meta name="description" content="Все АЗС «Шериф» в Приднестровье по городам: адреса, розничные цены в рублях и долларах, цены по топливным картам, маршрут в Яндекс Картах.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.grid2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;margin-top:20px;align-items:start}
.box h2{font-size:1.15rem;margin-bottom:8px}
.prices{width:100%;border-collapse:collapse}
.prices td,.prices th{padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.prices th{font-weight:400;font-size:.85rem;color:var(--ink-3)}
.prices td+td,.prices th+th{text-align:right;padding-left:16px;white-space:nowrap}
.prices tr:last-child td{border-bottom:0}
.prices b{font-weight:500}
.tag{margin-right:10px}
.note{font-size:.85rem;color:var(--ink-3);margin-top:12px}
.stations{list-style:none;padding:0;display:grid}
.stations li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.stations li:last-child{border-bottom:0}
.stations b{display:block;font-weight:500}
.stations span{font-size:.92rem;color:var(--ink-2)}
.links{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.links a{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;white-space:nowrap;text-underline-offset:3px;text-decoration-color:var(--line)}
.links a:hover{text-decoration-color:var(--ink)}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}.stations li{flex-direction:column;align-items:flex-start}.links{justify-content:flex-start}}
</style>
</head>
<body>
<main class="gutter"><div class="wrap">
  <div class="page-head"><h1>Города и АЗС</h1><p id="lead">Загружаем список заправок…</p></div>
  <div class="chips" id="cities" aria-label="Города"></div>
  <div class="grid2">
    <div style="display:grid;gap:16px">
      <section class="box"><h2 id="cityTitle">Цены</h2><table class="prices num"><thead><tr><th>Топливо</th><th>₽ / л</th><th>$ / л</th></tr></thead><tbody id="prices"></tbody></table><p class="note" id="same"></p></section>
      <section class="box"><h2>Топливные карты</h2><table class="prices num"><thead id="cardsHead"></thead><tbody id="cards"></tbody></table><p class="note">Цены по топливным картам «Шерифа» для бизнеса, одинаковые во всех городах.</p></section>
    </div>
    <section class="box"><h2 id="stTitle">Заправки</h2><ul class="stations" id="stations"></ul></section>
  </div>
</div></main>
<script type="module">
import { chrome, watchData, icon, rub, esc, tag } from './assets/app.js';
chrome();
const $ = s => document.querySelector(s);
let api, city = 0, built = false;

function render() {
  const c = api.latest.cities[city];
  $('#cityTitle').textContent = `Цены: ${c.name}`;
  $('#prices').innerHTML = api.fuels.map(f => `<tr><td>${tag(f.id)}${esc(f.name)}</td><td><b>${rub(c.rub[f.id])}</b></td><td>${c.usd ? '$' + rub(c.usd[f.id]) : '—'}</td></tr>`).join('');
  const same = api.latest.cities.every(x => api.fuels.every(f => x.rub[f.id] === api.latest.cities[0].rub[f.id]));
  $('#same').textContent = same ? 'Сейчас цены одинаковые во всех городах Приднестровья.' : 'Цены в городах сейчас отличаются, смотрите по своему.';
  $('#stTitle').textContent = `Заправки: ${c.name} (${c.stations.length})`;
  $('#stations').innerHTML = c.stations.map(s => `<li><div><b>${esc(s.code || 'АЗС')}</b><span>${esc(s.address)}</span></div><div class="links">
    <a href="https://yandex.ru/maps/?text=${encodeURIComponent('АЗС Шериф ' + s.address)}" target="_blank" rel="noopener">${icon('routing-2-linear')}Маршрут</a>
    <a href="${esc(s.url)}" target="_blank" rel="noopener">На сайте «Шерифа»</a></div></li>`).join('') || '<li>Нет данных о заправках</li>';
  document.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.c === city));
}

watchData(next => {
  api = next;
  const cs = api.latest.cities, total = cs.reduce((n, c) => n + c.stations.length, 0);
  $('#lead').textContent = `${total} заправок «Шериф» в ${cs.length} городах. Адреса — с официального сайта, «Маршрут» открывает Яндекс Карты.`;
  if (!built) {
    $('#cities').innerHTML = cs.map((c, i) => `<button class="chip" type="button" data-c="${i}" aria-pressed="${i === 0}">${esc(c.name)}<span class="n">${c.stations.length}</span></button>`).join('');
    document.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { city = +b.dataset.c; render(); }));
    built = true;
  }
  const cards = api.latest.cards || [];
  $('#cardsHead').innerHTML = `<tr><th>Топливо</th>${cards.map(t => `<th>${esc(t.label)}</th>`).join('')}</tr>`;
  $('#cards').innerHTML = api.fuels.map(f => `<tr><td>${tag(f.id)}${esc(f.name)}</td>${cards.map(t => `<td><b>${rub(t.rub[f.id])}</b></td>`).join('')}</tr>`).join('');
  render();
});
</script>
</body>
</html>
